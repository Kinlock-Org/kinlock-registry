# Daily (and on demand): every fixture payee registered on testnet must match its file
# (meta_hash, payout, category, attester, Active). Not run on PRs: a new payee is registered
# on-chain only after its PR merges. Roadmap M1-25.
name: onchain-match
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-onchain
